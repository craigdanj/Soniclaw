[package]
name = "soniclaw-session"
description = "Persisted audio settings and control-thread device recovery"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
[features]
native = ["dep:soniclaw-device", "dep:soniclaw-engine", "dep:soniclaw-record"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soniclaw-device = { workspace = true, optional = true }
soniclaw-engine = { workspace = true, optional = true }
soniclaw-record = { path = "../soniclaw-record", version = "0.146.0", optional = true }
[lints]
workspace = true
