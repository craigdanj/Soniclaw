[package]
name = "soniclaw-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[lib]
crate-type = ["rlib", "cdylib"]
[features]
default = ["gui"]
gui = ["soniclaw/vst3-hosting","soniclaw/formats","dep:eframe", "dep:image", "soniclaw/native", "soniclaw/ui", "soniclaw/device-ui", "soniclaw-example-processors/ui", "soniclaw-clap/editor"]
[dependencies]
soniclaw-example-processors = {path="../processor-pack",default-features=false}
rtrb = "=0.3.5"
soniclaw = {workspace=true,features=["hosting"]}
soniclaw-clap = { path = "../../crates/soniclaw-clap", version = "0.146.0" }
serde_json = "1"
eframe = { version = "=0.36.1", optional = true, default-features = false, features = ["accesskit", "glow", "x11", "wayland", "default_fonts"] }
image = { version = "=0.25.10", optional = true, default-features = false, features = ["png"] }
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
