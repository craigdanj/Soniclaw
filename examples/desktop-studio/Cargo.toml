[package]
name="soniclaw-desktop-studio"
version.workspace=true
edition.workspace=true
license.workspace=true
rust-version.workspace=true
publish=false
[features]
default=[]
gui=["soniclaw/midi-input","soniclaw/native","soniclaw/ui","dep:eframe","dep:soniclaw-host"]
[dependencies]
soniclaw.workspace=true
soniclaw-studio-demo={path="../studio-demo",version="0.146.0"}
serde_json="1"
hound="=3.5.1"
allocation-counter="=0.8.1"
eframe={version="=0.36.1",optional=true,default-features=false,features=["accesskit","glow","x11","wayland","default_fonts"]}
soniclaw-host={path="../../crates/soniclaw-host",version="0.146.0",optional=true,features=["studio","isolation"]}
[lints.rust]
unsafe_op_in_unsafe_fn="deny"
