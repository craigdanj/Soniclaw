[package]
name = "soniclaw-sdk-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[features]
default = []
device-tools = ["soniclaw/native"]
vst3-tools = ["soniclaw/vst3-hosting"]
format-tools = ["soniclaw/formats"]
[dependencies]
soniclaw = {workspace=true,features=["hosting"]}
soniclaw-workbench = {path="../workbench",default-features=false}
soniclaw-diagnostics = {path="../../crates/soniclaw-diagnostics",features=["allocations"]}
serde_json = "1"
allocation-counter = "=0.8.1"
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
