[package]
name="soniclaw-isolation-helper"
version.workspace=true
edition.workspace=true
license="MIT"
rust-version.workspace=true
publish=false
[[bin]]
name="vst3-host-helper"
path="../../third-party/vst3-host/src/bin/vst3-host-helper.rs"
[dependencies]
vst3-host={version="=0.11.1",default-features=false,features=["process-isolation"]}
serde_json="1"
[target.'cfg(target_os="macos")'.dependencies]
objc2="0.6"
objc2-app-kit={version="0.3.2",features=["NSApplication","NSWindow","NSView","NSResponder","NSGraphics","NSEvent"]}
objc2-foundation={version="0.3",features=["NSString","NSGeometry","NSDate","NSRunLoop"]}

# Upstream helper uses native GUI handles; it intentionally does not inherit unsafe_code=forbid.
[lints.rust]
unsafe_op_in_unsafe_fn="deny"
