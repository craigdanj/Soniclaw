[package]
name = "soniclaw-reference-studio"
description = "Native drum instrument using the same factory as the plug-in"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[dependencies]
soniclaw = { workspace = true, features = ["native", "ui", "midi-input"] }
soniclaw-reference = { path = "../reference", default-features = false }
eframe = { version = "=0.36.1", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
[lints]
workspace = true
